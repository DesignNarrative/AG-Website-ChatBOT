# Alembic configuration for Abhinav Group AI Chatbot database migrations
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# The DATABASE_URL is read from the app's settings at runtime
# Do not hardcode credentials here
sqlalchemy.url = sqlite:///./abhinav_chatbot_dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
